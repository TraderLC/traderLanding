# ==============================================================================
# Nginx Configuration for traderlc.com (Landing Page Frontend)
# Target on VPS: /etc/nginx/sites-available/traderlc.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name traderlc.com www.traderlc.com;

    # Client Request & Body Limits
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;
    gzip_vary on;

    # --------------------------------------------------------------------------
    # NEXT.JS STATIC ASSETS: Cache immutable build assets for 1 year
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:7100;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # NEXT.JS OPTIMIZED IMAGES
    # --------------------------------------------------------------------------
    location /_next/image {
        proxy_pass http://127.0.0.1:7100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # FRONTEND LANDING PAGE: Proxy all web requests to Next.js (Port 7100)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:7100;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events (SSE) Streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for Next.js App Router streaming responses
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
